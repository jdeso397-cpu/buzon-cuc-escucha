<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buzón CUC Escucha</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Buzón CUC Escucha</h1>
    <p>Queremos conocer tus ideas y sugerencias para mejorar tu experiencia académica y universitaria.</p>
    
    <form id="buzonForm">
      <label for="nombre">Nombre Completo:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="categoria">Categoría:</label>
      <select id="categoria" name="categoria" required>
        <option value="bienestar">Bienestar</option>
        <option value="servicios">Servicios</option>
        <option value="clases">Clases / Docentes</option>
        <option value="inclusion">Inclusión y Espacios</option>
      </select>

      <label for="sugerencia">Sugerencia o Idea:</label>
      <textarea id="sugerencia" name="sugerencia" rows="4" required></textarea>

      <label for="correo">Correo Institucional:</label>
      <input type="email" id="correo" name="correo" placeholder="usuario@cuc.edu.co" required>

      <button type="submit">Enviar Sugerencia</button>
    </form>
  </div>
</body>
</html>
